<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 840">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .title { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans  { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1240" height="840" fill="#F3EEE2"/>

  <!-- ===== HEADER ===== -->
  <text x="95" y="64" class="sans" font-size="12.5" font-weight="500"
        fill="#B8935A" letter-spacing="4.2">BUILDING&#160;INTELLIGENCE&#160;&#160;·&#160;&#160;RESEARCH</text>
  <text x="1145" y="64" text-anchor="end" class="sans" font-size="12.5" font-weight="400"
        fill="#1B2B45" letter-spacing="3.2" opacity="0.5">FIGURE&#160;01</text>
  <line x1="95" y1="84" x2="1145" y2="84" stroke="#1B2B45" stroke-width="1"/>

  <!-- ===== TITLE ===== -->
  <text x="92" y="153" class="title" font-size="54" font-weight="600"
        fill="#1B2B45">Building Performance Over Time</text>
  <line x1="95" y1="171" x2="183" y2="171" stroke="#B8935A" stroke-width="2.5"/>
  <text x="95" y="201" class="sans" font-size="15.5" font-weight="400" fill="#222222">
    Understanding how maintenance influences long-term building performance.</text>

  <!-- legend -->
  <g class="sans" font-size="13" font-weight="400" fill="#222222">
    <line x1="772" y1="196" x2="806" y2="196" stroke="#B8935A" stroke-width="2.6"/>
    <text x="814" y="201">Managed Lifecycle</text>
    <line x1="990" y1="196" x2="1024" y2="196" stroke="#1B2B45" stroke-width="1.5"
          stroke-dasharray="6 5" opacity="0.55"/>
    <text x="1032" y="201">Natural Deterioration</text>
  </g>

  <!-- ===== GRID ===== -->
  <g stroke="#1B2B45" stroke-width="1" opacity="0.08">
    <line x1="155" y1="365" x2="1085" y2="365"/>
    <line x1="155" y1="460" x2="1085" y2="460"/>
    <line x1="155" y1="555" x2="1085" y2="555"/>
  </g>

  <!-- renovation threshold -->
  <line x1="155" y1="357.4" x2="1085" y2="357.4" stroke="#B8935A" stroke-width="1"
        stroke-dasharray="3 5" opacity="0.85"/>
  <text x="1085" y="349" text-anchor="end" class="sans" font-size="11" font-weight="500"
        fill="#B8935A" letter-spacing="1.6">RENOVATION&#160;THRESHOLD</text>

  <!-- axes -->
  <line x1="155" y1="270" x2="155" y2="650" stroke="#1B2B45" stroke-width="1.2"/>
  <line x1="155" y1="650" x2="1085" y2="650" stroke="#1B2B45" stroke-width="1.2"/>

  <!-- y ticks -->
  <g class="sans" font-size="12" font-weight="400" fill="#1B2B45" opacity="0.5" text-anchor="end">
    <text x="143" y="275">100</text>
    <text x="143" y="370">75</text>
    <text x="143" y="465">50</text>
    <text x="143" y="560">25</text>
    <text x="143" y="655">0</text>
  </g>
  <!-- x ticks -->
  <g class="sans" font-size="12" font-weight="400" fill="#1B2B45" opacity="0.5" text-anchor="middle">
    <text x="155" y="673">0</text>
    <text x="310" y="673">10</text>
    <text x="465" y="673">20</text>
    <text x="620" y="673">30</text>
    <text x="775" y="673">40</text>
    <text x="930" y="673">50</text>
    <text x="1085" y="673">60</text>
  </g>

  <!-- axis titles -->
  <text transform="translate(100,460) rotate(-90)" text-anchor="middle" class="sans"
        font-size="13" font-weight="400" fill="#222222" letter-spacing="0.6">Building Condition Index</text>
  <text x="620" y="704" text-anchor="middle" class="sans" font-size="13" font-weight="400"
        fill="#222222" letter-spacing="0.6">Age of Building (Years)</text>

  <!-- ===== CURVES ===== -->
  <!-- natural deterioration · exponential decline -->
  <path d="M155,270 C180.83,271.77 258.33,274.45 310,280.6
           C361.67,286.75 413.33,295.93 465,306.9
           C516.67,317.87 568.33,331.15 620,346.4
           C671.67,361.65 723.33,379.22 775,398.4
           C826.67,417.58 878.33,438.57 930,461.5
           C981.67,484.43 1059.17,523.58 1085,536"
        fill="none" stroke="#1B2B45" stroke-width="1.5"
        stroke-dasharray="6 5" opacity="0.5" stroke-linecap="round"/>

  <!-- managed lifecycle · organic recovery -->
  <path d="M155,270 C198.92,287.73 361.67,371.97 418.5,376.4
           C475.33,380.83 449.5,295.97 496,296.6
           C542.5,297.23 651,378.93 697.5,380.2
           C744,381.47 731.08,303.57 775,304.2
           C818.92,304.83 917.08,382.73 961,384
           C1004.92,385.27 1017.83,322.57 1038.5,311.8
           C1059.17,301.03 1077.25,318.13 1085,319.4"
        fill="none" stroke="#B8935A" stroke-width="2.6"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- intervention markers -->
  <g fill="#1B2B45">
    <circle cx="418.5" cy="376.4" r="3"/>
    <circle cx="697.5" cy="380.2" r="3"/>
    <circle cx="961" cy="384" r="3"/>
  </g>
  <g fill="#F3EEE2" stroke="#B8935A" stroke-width="2.2">
    <circle cx="496" cy="296.6" r="7"/>
    <circle cx="775" cy="304.2" r="7"/>
    <circle cx="1038.5" cy="311.8" r="7"/>
  </g>

  <!-- ===== METHOD RIBBON ===== -->
  <text x="620" y="736" text-anchor="middle" class="sans" font-size="12.5" font-weight="500"
        fill="#B8935A" letter-spacing="5">OBSERVE&#160;&#160;·&#160;&#160;UNDERSTAND&#160;&#160;·&#160;&#160;EVALUATE&#160;&#160;·&#160;&#160;DECIDE</text>

  <!-- ===== FOOTER ===== -->
  <line x1="95" y1="774" x2="1145" y2="774" stroke="#1B2B45" stroke-width="1"/>
  <text x="95" y="800" class="sans" font-size="12" font-weight="400" fill="#1B2B45" opacity="0.6"
        letter-spacing="0.4">Illustrative · The MEIFERTS Standard™ · meifertslifecycle.com</text>
  <text x="95" y="816" class="sans" font-size="10" font-weight="400" fill="#1B2B45" opacity="0.4"
        letter-spacing="0.6">Version 4.0</text>
  <text x="1145" y="796" text-anchor="end" class="sans" font-size="15" font-weight="600"
        fill="#1B2B45" letter-spacing="2.5">MEIFERTS®</text>
  <text x="1145" y="811" text-anchor="end" class="sans" font-size="8.5" font-weight="500"
        fill="#B8935A" letter-spacing="3.6">BUILDING&#160;INTELLIGENCE</text>
</svg>
