<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Evidence | MEIFERTS Building Intelligence Platform</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--navy:#1B2B45;--gold:#B8935A;--cream:#F3EEE2;--line:rgba(27,43,69,.16)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--cream);color:#1f2933}
.wrap{max-width:1100px;margin:0 auto;padding:48px 5vw}
h1,h2{font-family:Georgia,serif;font-weight:400;color:var(--navy)}
h1{font-size:64px;line-height:.95}
.panel{background:rgba(255,255,255,.55);border:1px solid var(--line);padding:28px;margin:24px 0}
.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-size:12px;font-weight:700}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid var(--line)}
textarea{min-height:90px}
button,.button{display:inline-block;background:var(--navy);color:var(--cream);border:0;padding:13px 18px;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.item{background:rgba(255,255,255,.6);border:1px solid var(--line);padding:18px;margin:12px 0}
.tag{display:inline-block;border:1px solid rgba(184,147,90,.35);padding:5px 8px;color:var(--gold);font-size:11px;text-transform:uppercase;margin-right:6px}
@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:44px}}
</style>
</head>
<body>

<div class="wrap">

<section class="panel" id="no-case" style="display:none">
<div class="eyebrow">No Active Case</div>
<h1>No case selected.</h1>
<p>Please open a case first.</p>
<a class="button" href="cases.html">Open Cases</a>
</section>

<div id="workspace">
<div class="eyebrow">Evidence Workspace</div>
<h1 id="case-title">Evidence.</h1>
<p id="case-subtitle">Loading...</p>

<div class="grid">
<section class="panel">
<div class="eyebrow">Capture Evidence</div>
<h2>New evidence</h2>

<select id="type">
<option value="photo">Photo</option>
<option value="document">Document</option>
<option value="note">Note</option>
<option value="measurement">Measurement</option>
</select>

<input id="title" placeholder="Title">
<input id="location" placeholder="Location / area">
<input id="system" placeholder="Building system">
<select id="severity">
<option>Unrated</option>
<option>Low</option>
<option>Medium</option>
<option>High</option>
<option>Critical</option>
</select>
<textarea id="description" placeholder="Description"></textarea>
<button id="save">Save Evidence</button>
</section>

<section class="panel">
<div class="eyebrow">Current Case</div>
<h2 id="current-case">Loading...</h2>
<p>Status: <strong id="case-status">–</strong></p>
<p>Risk: <strong id="case-risk">–</strong></p>
<p>Evidence objects: <strong id="count">0</strong></p>
</section>
</div>

<section class="panel">
<div class="eyebrow">Evidence Register</div>
<h2>Captured evidence</h2>
<div id="list"></div>
</section>
</div>

</div>

<script type="module">
import CaseManager from "./core/CaseManager.js";
import EvidenceManager from "./core/EvidenceManager.js";

console.log("CaseManager:", CaseManager);
console.log("Current:", CaseManager.getCurrent());
console.log("EvidenceManager:", EvidenceManager);

const noCase = document.getElementById("no-case");
const workspace = document.getElementById("workspace");

let currentCase = CaseManager.getCurrent();

if (!currentCase) {
    const storedCases = JSON.parse(localStorage.getItem("mbi:cases") || "[]");
    currentCase = storedCases.length ? storedCases[storedCases.length - 1] : null;
    if (currentCase) CaseManager.open(currentCase);
}

if (!currentCase) {
    noCase.style.display = "block";
    workspace.style.display = "none";
} else {
    renderCase();
    renderEvidence();
}

function renderCase() {
    document.getElementById("case-title").textContent = currentCase.title;
    document.getElementById("case-subtitle").textContent = `${currentCase.type} · ${currentCase.status}`;
    document.getElementById("current-case").textContent = currentCase.title;
    document.getElementById("case-status").textContent = currentCase.status || "–";
    document.getElementById("case-risk").textContent = currentCase.riskScore ?? "–";
}

function renderEvidence() {
    const items = EvidenceManager.getByCase(currentCase.id);
    document.getElementById("count").textContent = items.length;

    const list = document.getElementById("list");

    if (!items.length) {
        list.innerHTML = `<div class="item"><strong>No evidence captured yet.</strong><p>Create the first evidence object above.</p></div>`;
        return;
    }

    list.innerHTML = items.map(item => `
        <div class="item">
            <div class="eyebrow">${item.type} · ${item.category}</div>
            <h2>${item.title}</h2>
            <p>${item.description || "No description."}</p>
            <span class="tag">${item.location || "No location"}</span>
            <span class="tag">${item.buildingSystem || "No system"}</span>
            <span class="tag">${item.severity}</span>
        </div>
    `).join("");
}

document.getElementById("save").addEventListener("click", () => {

    if (!currentCase) {
        alert("No active case.");
        return;
    }

    const title = document.getElementById("title").value.trim();

    if (!title) {
        alert("Bitte Titel eingeben.");
        return;
    }

    EvidenceManager.create({
        id: `evidence-${Date.now()}`,
        caseId: currentCase.id,
        buildingId: currentCase.buildingId,
        inspectionId: currentCase.inspectionId || null,
        type: document.getElementById("type").value,
        category: "Field Evidence",
        title,
        location: document.getElementById("location").value.trim(),
        buildingSystem: document.getElementById("system").value.trim(),
        severity: document.getElementById("severity").value,
        description: document.getElementById("description").value.trim(),
        status: "Captured",
        createdBy: "Matthias Meiferts"
    });

    document.getElementById("title").value = "";
    document.getElementById("location").value = "";
    document.getElementById("system").value = "";
    document.getElementById("description").value = "";

    renderEvidence();
});
</script>

</body>
</html>
