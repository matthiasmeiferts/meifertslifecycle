<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="robots"
    content="noindex, nofollow, noarchive, nosnippet, noimageindex"
  >
  <meta
    name="googlebot"
    content="noindex, nofollow, noarchive, nosnippet, noimageindex"
  >

  <title>MEIFERTS Building Intelligence | Controlled Review</title>

  <style>
    :root {
      --navy: #172842;
      --cream: #f4efe4;
      --gold: #b89a62;
      --ink: #18243a;
      --muted: #697388;
      --line: rgba(23, 40, 66, 0.16);
      --white: #fffaf1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--cream);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(920px, 100%);
      padding: 56px;
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 6px;
      box-shadow: 0 24px 80px rgba(23, 40, 66, 0.10);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 7vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    p {
      max-width: 690px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.55;
    }

    @media (max-width: 720px) {
      main {
        padding: 34px 26px;
      }

      p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">MEIFERTS Building Intelligence</p>

    <h1>Controlled review in progress.</h1>

    <p>
      The public website is currently being prepared for release.
    </p>
  </main>
</body>
</html>
